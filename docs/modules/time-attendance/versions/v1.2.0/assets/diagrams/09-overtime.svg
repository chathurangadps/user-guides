<text x="382" y="129" font-size="18" font-weight="700" fill="#352347">Employee request</text>
<text x="382" y="177" font-size="14" fill="#4e5d72">Requested minutes and reason</text>
<rect x="688" y="100" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="706" y="129" font-size="18" font-weight="700" fill="#352347">Supervisor authorization</text>
<text x="706" y="177" font-size="14" fill="#4e5d72">Approved minutes cannot exceed</text>
<text x="706" y="195" font-size="14" fill="#4e5d72">request</text>
<rect x="688" y="300" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="706" y="329" font-size="18" font-weight="700" fill="#352347">HR payable decision</text>
<text x="706" y="377" font-size="14" fill="#4e5d72">Separate payable quantity and</text>
<text x="706" y="395" font-size="14" fill="#4e5d72">reference</text>
<rect x="364" y="300" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="382" y="329" font-size="18" font-weight="700" fill="#352347">Period and handoff checks</text>
<text x="382" y="377" font-size="14" fill="#4e5d72">Closed attendance; reviewed</text>
<text x="382" y="395" font-size="14" fill="#4e5d72">conversion</text>
<rect x="40" y="300" width="272" height="126" rx="10" fill="#eaf6f0" stroke="#39765c" stroke-width="1.5"/>
<text x="58" y="329" font-size="18" font-weight="700" fill="#23513e">Independent incidence</text>
<text x="58" y="352" font-size="18" font-weight="700" fill="#23513e">review</text>
<text x="58" y="377" font-size="14" fill="#4e5d72">Draft payroll input checked</text>
