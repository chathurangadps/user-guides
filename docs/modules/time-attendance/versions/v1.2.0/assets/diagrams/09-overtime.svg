<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="461" viewBox="0 0 1000 461" role="img" aria-labelledby="title desc">
<title id="title">Worked time, authorized overtime and payable overtime are different</title>
<desc id="desc">A late checkout is evidence of a recorded time, not an automatic entitlement to payable overtime. Use an eligible supervisor-approved employee-day and a reason for the requested minutes. The assigned supervisor approves or rejects the authorization request. HR separately reviews what is payable under the applicable reviewed policy and evidence. Use period close, reviewed conversion and independently checked Draft incidences for payroll handoff.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#65748b"/></marker></defs>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<g fill="none" stroke="#65748b" stroke-width="2" stroke-linejoin="round">
<path d="M312,163 L364,163" marker-end="url(#arrow)"/>
<path d="M636,163 L688,163" marker-end="url(#arrow)"/>
<path d="M824,226 L824,300" marker-end="url(#arrow)"/>
<path d="M688,363 L636,363" marker-end="url(#arrow)"/>
<path d="M364,363 L312,363" marker-end="url(#arrow)"/>
</g><g font-family="Arial, Helvetica, sans-serif">
<rect x="40" y="100" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="58" y="129" font-size="18" font-weight="700" fill="#352347">Reviewed employee-day</text>
<text x="58" y="177" font-size="14" fill="#4e5d72">Recorded work evidence is</text>
<text x="58" y="195" font-size="14" fill="#4e5d72">available</text>
