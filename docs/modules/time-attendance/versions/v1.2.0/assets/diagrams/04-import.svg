<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="861" viewBox="0 0 1000 861" role="img" aria-labelledby="title desc">
<title id="title">Import the ready groups while retaining exceptions</title>
<desc id="desc">Review import covers all ready employee-days in the saved batch, across pages and regardless of display filters. Upload or resume and run Preview / Refresh. Ready groups may proceed together; exceptions remain in the batch for later resolution. Review the confirmation counts. Filters and the current page do not restrict the all-ready import scope. After import, compare counts and source links. Re-upload or retry uses duplicate protection rather than adding the same protected punch again.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#65748b"/></marker></defs>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<g fill="none" stroke="#65748b" stroke-width="2" stroke-linejoin="round">
<path d="M312,163 L364,163" marker-end="url(#arrow)"/>
<path d="M500,226 L500,300" marker-end="url(#arrow)"/>
<path d="M636,363 L688,363" marker-end="url(#arrow)"/>
<path d="M824,300 L824,40 L500,40 L500,100" marker-end="url(#arrow)"/>
<path d="M500,426 L500,500" marker-end="url(#arrow)"/>
<path d="M500,626 L500,700" marker-end="url(#arrow)"/>
<path d="M636,763 L688,763" marker-end="url(#arrow)"/>
<path d="M824,700 L824,426" marker-end="url(#arrow)"/>
</g><g font-family="Arial, Helvetica, sans-serif">
<rect x="40" y="100" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="58" y="129" font-size="18" font-weight="700" fill="#352347">Upload or resume</text>
<text x="58" y="177" font-size="14" fill="#4e5d72">Attendance user · organization</text>
<text x="58" y="195" font-size="14" fill="#4e5d72">and dates</text>
<rect x="364" y="100" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="382" y="129" font-size="18" font-weight="700" fill="#352347">Preview / refresh</text>
<text x="382" y="177" font-size="14" fill="#4e5d72">Validate the current batch</text>
<text x="382" y="195" font-size="14" fill="#4e5d72">version</text>
<path d="M500,300 L636,363 L500,426 L364,363 Z" fill="#fff5dd" stroke="#a27620" stroke-width="2"/>
<text x="500" y="355" text-anchor="middle" font-weight="700" font-size="18" fill="#614914">Any ready groups?</text>
<text x="500" y="379" text-anchor="middle" font-size="13" fill="#614914">Current validation result</text>
<rect x="688" y="300" width="272" height="126" rx="10" fill="#fff8e9" stroke="#ad8433" stroke-width="1.5"/>
<text x="706" y="329" font-size="18" font-weight="700" fill="#624c20">Keep exceptions</text>
<text x="706" y="377" font-size="14" fill="#4e5d72">Filter, export and correct with</text>
<text x="706" y="395" font-size="14" fill="#4e5d72">reasons</text>
<rect x="364" y="500" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="382" y="529" font-size="18" font-weight="700" fill="#352347">Review import</text>
<text x="382" y="577" font-size="14" fill="#4e5d72">Confirm all-ready counts and</text>
<text x="382" y="595" font-size="14" fill="#4e5d72">scope</text>
<rect x="364" y="700" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="382" y="729" font-size="18" font-weight="700" fill="#352347">Import drafts</text>
<text x="382" y="777" font-size="14" fill="#4e5d72">Recheck eligibility and</text>
<text x="382" y="795" font-size="14" fill="#4e5d72">duplicates</text>
<rect x="688" y="700" width="272" height="126" rx="10" fill="#eaf6f0" stroke="#39765c" stroke-width="1.5"/>
<text x="706" y="729" font-size="18" font-weight="700" fill="#23513e">Verify result</text>
<text x="706" y="777" font-size="14" fill="#4e5d72">Saved Draft counts and source</text>
<text x="706" y="795" font-size="14" fill="#4e5d72">links</text>
<text x="662" y="353" text-anchor="middle" font-size="13" font-weight="600" fill="#46536a" stroke="#fff" stroke-width="6" paint-order="stroke">No</text>
<text x="662" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="#46536a" stroke="#fff" stroke-width="6" paint-order="stroke">Re-preview</text>
