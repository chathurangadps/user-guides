<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="661" viewBox="0 0 1000 661" role="img" aria-labelledby="title desc">
<title id="title">A correction is proposed, approved and then applied</title>
<desc id="desc">Approving the request does not by itself rewrite native attendance. Application has its own state and consistency checks. Load the original employee-day and propose the full corrected timestamp list, with a reason and relevant evidence. Save and submit the request. A returned request needs clarification and resubmission; a rejected request does not change punches. After approval, use Apply Approved Attendance Correction for an eligible record. The application step rechecks the current revision and period/payroll constraints, preserves the original evidence and triggers the required further review.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#65748b"/></marker></defs>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<g fill="none" stroke="#65748b" stroke-width="2" stroke-linejoin="round">
<path d="M312,163 L364,163" marker-end="url(#arrow)"/>
<path d="M636,163 L688,163" marker-end="url(#arrow)"/>
<path d="M824,226 L824,300" marker-end="url(#arrow)"/>
<path d="M688,363 L636,363" marker-end="url(#arrow)"/>
<path d="M364,363 L312,363" marker-end="url(#arrow)"/>
<path d="M176,426 L176,500" marker-end="url(#arrow)"/>
</g><g font-family="Arial, Helvetica, sans-serif">
<rect x="40" y="100" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="58" y="129" font-size="18" font-weight="700" fill="#352347">Select eligible day</text>
<text x="58" y="177" font-size="14" fill="#4e5d72">Employee · load original punches</text>
<rect x="364" y="100" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="382" y="129" font-size="18" font-weight="700" fill="#352347">Propose complete times</text>
<text x="382" y="177" font-size="14" fill="#4e5d72">Include valid unchanged times and</text>
<text x="382" y="195" font-size="14" fill="#4e5d72">reason</text>
<rect x="688" y="100" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="706" y="129" font-size="18" font-weight="700" fill="#352347">Save draft / submit</text>
<text x="706" y="177" font-size="14" fill="#4e5d72">Attach allowed supporting</text>
<text x="706" y="195" font-size="14" fill="#4e5d72">evidence</text>
<rect x="688" y="300" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="706" y="329" font-size="18" font-weight="700" fill="#352347">Supervisor reviews</text>
<text x="706" y="377" font-size="14" fill="#4e5d72">Approve, return or reject the</text>
<text x="706" y="395" font-size="14" fill="#4e5d72">proposal</text>
<rect x="364" y="300" width="272" height="126" rx="10" fill="#fff8e9" stroke="#ad8433" stroke-width="1.5"/>
<text x="382" y="329" font-size="18" font-weight="700" fill="#624c20">Approved proposal</text>
<text x="382" y="377" font-size="14" fill="#4e5d72">Ready for separate application</text>
<text x="382" y="395" font-size="14" fill="#4e5d72">checks</text>
<rect x="40" y="300" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="58" y="329" font-size="18" font-weight="700" fill="#352347">HR applies correction</text>
<text x="58" y="377" font-size="14" fill="#4e5d72">Recheck revision, period and</text>
<text x="58" y="395" font-size="14" fill="#4e5d72">payroll state</text>
<rect x="40" y="500" width="272" height="126" rx="10" fill="#eaf6f0" stroke="#39765c" stroke-width="1.5"/>
<text x="58" y="529" font-size="18" font-weight="700" fill="#23513e">Recalculate / re-review</text>
<text x="58" y="577" font-size="14" fill="#4e5d72">Preserve originals and correction</text>
<text x="58" y="595" font-size="14" fill="#4e5d72">history</text>
<text x="662" y="353" text-anchor="middle" font-size="13" font-weight="600" fill="#46536a" stroke="#fff" stroke-width="6" paint-order="stroke">Approved</text>
</g></svg>
