<text x="500" y="355" text-anchor="middle" font-weight="700" font-size="18" fill="#614914">Review decision</text>
<text x="500" y="379" text-anchor="middle" font-size="13" fill="#614914">Assigned reviewer only</text>
<rect x="688" y="300" width="272" height="126" rx="10" fill="#fff8e9" stroke="#ad8433" stroke-width="1.5"/>
<text x="706" y="329" font-size="18" font-weight="700" fill="#624c20">Return for correction</text>
<text x="706" y="377" font-size="14" fill="#4e5d72">Employee clarifies and resubmits</text>
<rect x="364" y="500" width="272" height="126" rx="10" fill="#eaf6f0" stroke="#39765c" stroke-width="1.5"/>
<text x="382" y="529" font-size="18" font-weight="700" fill="#23513e">Supervisor approved</text>
