<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="661" viewBox="0 0 1000 661" role="img" aria-labelledby="title desc">
<title id="title">Submit attendance, then approve it or return it for clarification</title>
<desc id="desc">The assigned supervisor decides on the submitted revision. Review approval remains separate from document completion and pay. The employee or authorized HR reviews the draft and submits it with a comment. The assigned supervisor checks punches, evidence and the current revision. Return a disputed record for clarification; an eligible corrected record must be submitted again. Approval records the supervisor decision. It does not automatically complete the native document or payroll.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#65748b"/></marker></defs>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<g fill="none" stroke="#65748b" stroke-width="2" stroke-linejoin="round">
<path d="M312,163 L364,163" marker-end="url(#arrow)"/>
<path d="M500,226 L500,300" marker-end="url(#arrow)"/>
<path d="M636,363 L688,363" marker-end="url(#arrow)"/>
