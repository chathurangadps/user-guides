<rect x="688" y="500" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="706" y="529" font-size="18" font-weight="700" fill="#352347">Separate payable review</text>
<text x="706" y="577" font-size="14" fill="#4e5d72">HR · approved quantities and</text>
<text x="706" y="595" font-size="14" fill="#4e5d72">references</text>
