<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="661" viewBox="0 0 1000 661" role="img" aria-labelledby="title desc">
<title id="title">Prepare masters, review them, then assign effective coverage</title>
<desc id="desc">Work from the employee and schedule masters toward one reviewed roster and policy for each work date. Confirm employee identity and supervisor routing before assigning a schedule. Prepare draft roster/policy versions and obtain the required independent review. Create and approve effective roster, policy and legal-regime assignments. Use the coverage report to resolve gaps or overlaps, then generate expected days.</desc>
