<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="661" viewBox="0 0 1000 661" role="img" aria-labelledby="title desc">
<title id="title">From schedule to payroll: nine distinct checkpoints</title>
<desc id="desc">Read left to right, then follow the arrows. Every stage keeps its own status and responsible role. Complete reviewed setup and generate the employee-days expected in the range. Preview, resolve exceptions and import eligible attendance as drafts. Obtain supervisor review, then separate payable decisions. Close the attendance period, stage the approved inputs and obtain independent incidence checking before the normal payroll run.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#65748b"/></marker></defs>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<g fill="none" stroke="#65748b" stroke-width="2" stroke-linejoin="round">
<path d="M312,163 L364,163" marker-end="url(#arrow)"/>
<path d="M636,163 L688,163" marker-end="url(#arrow)"/>
<path d="M824,226 L824,300" marker-end="url(#arrow)"/>
<path d="M688,363 L636,363" marker-end="url(#arrow)"/>
<path d="M364,363 L312,363" marker-end="url(#arrow)"/>
<path d="M176,426 L176,500" marker-end="url(#arrow)"/>
<path d="M312,563 L364,563" marker-end="url(#arrow)"/>
<path d="M636,563 L688,563" marker-end="url(#arrow)"/>
</g><g font-family="Arial, Helvetica, sans-serif">
<rect x="40" y="100" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
