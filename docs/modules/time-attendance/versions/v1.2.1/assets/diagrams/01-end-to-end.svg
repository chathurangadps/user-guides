<text x="58" y="177" font-size="14" fill="#4e5d72">HR · employees, schedules and</text>
<text x="58" y="195" font-size="14" fill="#4e5d72">rules</text>
<rect x="364" y="100" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="382" y="129" font-size="18" font-weight="700" fill="#352347">Expected days</text>
<text x="382" y="177" font-size="14" fill="#4e5d72">HR · include days without punches</text>
<rect x="688" y="100" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="706" y="129" font-size="18" font-weight="700" fill="#352347">Preview and resolve</text>
<text x="706" y="177" font-size="14" fill="#4e5d72">Attendance user · source evidence</text>
<rect x="688" y="300" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="706" y="329" font-size="18" font-weight="700" fill="#352347">Import drafts</text>
<text x="706" y="377" font-size="14" fill="#4e5d72">Attendance user · save native</text>
<text x="706" y="395" font-size="14" fill="#4e5d72">punches</text>
<rect x="364" y="300" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="382" y="329" font-size="18" font-weight="700" fill="#352347">Supervisor review</text>
<text x="382" y="377" font-size="14" fill="#4e5d72">Assigned reviewer · approve or</text>
<text x="382" y="395" font-size="14" fill="#4e5d72">return</text>
<rect x="40" y="300" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="58" y="329" font-size="18" font-weight="700" fill="#352347">Payable decisions</text>
<text x="58" y="377" font-size="14" fill="#4e5d72">HR · regular and overtime</text>
