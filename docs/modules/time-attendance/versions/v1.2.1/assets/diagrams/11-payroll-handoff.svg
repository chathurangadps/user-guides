<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="661" viewBox="0 0 1000 661" role="img" aria-labelledby="title desc">
<title id="title">Stage reviewed quantities, then have a different checker review them</title>
<desc id="desc">The handoff creates traceable native Draft incidences. The normal payroll calculation and payment remain separate. Select a closed attendance period and the correct open HR payroll period. Review the manual quantity input concept, mapping reference, units and rounding. Inspect regular and overtime candidates separately, including exclusions and existing source links. Stage eligible Draft incidences and obtain independent checking; reconcile before normal payroll processing.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#65748b"/></marker></defs>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<g fill="none" stroke="#65748b" stroke-width="2" stroke-linejoin="round">
<path d="M312,163 L364,163" marker-end="url(#arrow)"/>
<path d="M636,163 L688,163" marker-end="url(#arrow)"/>
<path d="M824,226 L824,300" marker-end="url(#arrow)"/>
<path d="M688,363 L636,363" marker-end="url(#arrow)"/>
<path d="M364,363 L312,363" marker-end="url(#arrow)"/>
<path d="M176,426 L176,500" marker-end="url(#arrow)"/>
</g><g font-family="Arial, Helvetica, sans-serif">
<rect x="40" y="100" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="58" y="129" font-size="18" font-weight="700" fill="#352347">Attendance period closed</text>
<text x="58" y="177" font-size="14" fill="#4e5d72">Payroll maker · eligible sources</text>
<text x="58" y="195" font-size="14" fill="#4e5d72">only</text>
<rect x="364" y="100" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="382" y="129" font-size="18" font-weight="700" fill="#352347">Select open payroll</text>
<text x="382" y="152" font-size="18" font-weight="700" fill="#352347">period</text>
<text x="382" y="177" font-size="14" fill="#4e5d72">Must cover the full attendance</text>
<text x="382" y="195" font-size="14" fill="#4e5d72">range</text>
<rect x="688" y="100" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="706" y="129" font-size="18" font-weight="700" fill="#352347">Review concept and units</text>
<text x="706" y="177" font-size="14" fill="#4e5d72">Regular unit or explicit OT</text>
<text x="706" y="195" font-size="14" fill="#4e5d72">conversion</text>
<rect x="688" y="300" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="706" y="329" font-size="18" font-weight="700" fill="#352347">Preview candidates</text>
<text x="706" y="377" font-size="14" fill="#4e5d72">Check quantities, exclusions and</text>
<text x="706" y="395" font-size="14" fill="#4e5d72">links</text>
<rect x="364" y="300" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="382" y="329" font-size="18" font-weight="700" fill="#352347">Stage Draft incidences</text>
<text x="382" y="377" font-size="14" fill="#4e5d72">Protected source/version linkage</text>
<rect x="40" y="300" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="58" y="329" font-size="18" font-weight="700" fill="#352347">Independent checking</text>
<text x="58" y="377" font-size="14" fill="#4e5d72">Different authorized incidence</text>
<text x="58" y="395" font-size="14" fill="#4e5d72">checker</text>
<rect x="40" y="500" width="272" height="126" rx="10" fill="#eaf6f0" stroke="#39765c" stroke-width="1.5"/>
<text x="58" y="529" font-size="18" font-weight="700" fill="#23513e">Normal payroll workflow</text>
<text x="58" y="577" font-size="14" fill="#4e5d72">Calculate, reconcile and</text>
<text x="58" y="595" font-size="14" fill="#4e5d72">authorize pay</text>
</g></svg>
