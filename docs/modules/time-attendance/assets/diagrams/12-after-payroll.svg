<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="861" viewBox="0 0 1000 861" role="img" aria-labelledby="title desc">
<title id="title">After handoff, preserve the original and correct through the right route</title>
<desc id="desc">First inspect whether the linked incidence is still an eligible unprocessed Draft or has already completed payroll processing. For an eligible unprocessed Draft, use the supported void/reconciliation action before other period changes. For completed payroll, preserve the original incidence and select the permitted later open period. Enter the corrected total quantity. The compensation workflow derives the adjustment against the recorded history. Have a different authorized checker review the compensating Draft and reconcile the final linked result.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#65748b"/></marker></defs>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<g fill="none" stroke="#65748b" stroke-width="2" stroke-linejoin="round">
<path d="M312,163 L364,163" marker-end="url(#arrow)"/>
<path d="M636,163 L688,163" marker-end="url(#arrow)"/>
<path d="M500,226 L500,300" marker-end="url(#arrow)"/>
<path d="M500,426 L500,500" marker-end="url(#arrow)"/>
<path d="M636,563 L688,563" marker-end="url(#arrow)"/>
<path d="M824,626 L824,700" marker-end="url(#arrow)"/>
</g><g font-family="Arial, Helvetica, sans-serif">
<rect x="40" y="100" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="58" y="129" font-size="18" font-weight="700" fill="#352347">Find source and incidence</text>
<text x="58" y="177" font-size="14" fill="#4e5d72">HR / payroll · inspect linked</text>
<text x="58" y="195" font-size="14" fill="#4e5d72">state</text>
<path d="M500,100 L636,163 L500,226 L364,163 Z" fill="#fff5dd" stroke="#a27620" stroke-width="2"/>
<text x="500" y="155" text-anchor="middle" font-weight="700" font-size="18" fill="#614914">Still a Draft?</text>
<text x="500" y="179" text-anchor="middle" font-size="13" fill="#614914">Unprocessed and eligible</text>
<rect x="688" y="100" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="706" y="129" font-size="18" font-weight="700" fill="#352347">Void eligible Draft</text>
<text x="706" y="177" font-size="14" fill="#4e5d72">Reason and supported</text>
<text x="706" y="195" font-size="14" fill="#4e5d72">reconciliation</text>
<rect x="364" y="300" width="272" height="126" rx="10" fill="#fff8e9" stroke="#ad8433" stroke-width="1.5"/>
<text x="382" y="329" font-size="18" font-weight="700" fill="#624c20">Completed payroll route</text>
<text x="382" y="377" font-size="14" fill="#4e5d72">Use a later open payroll period</text>
<rect x="364" y="500" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="382" y="529" font-size="18" font-weight="700" fill="#352347">Enter corrected TOTAL</text>
<text x="382" y="577" font-size="14" fill="#4e5d72">Example: 7 hours total, not minus</text>
<text x="382" y="595" font-size="14" fill="#4e5d72">1</text>
<rect x="688" y="500" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="706" y="529" font-size="18" font-weight="700" fill="#352347">Compensating Draft</text>
<text x="706" y="577" font-size="14" fill="#4e5d72">System derives adjustment from</text>
<text x="706" y="595" font-size="14" fill="#4e5d72">history</text>
<rect x="688" y="700" width="272" height="126" rx="10" fill="#eaf6f0" stroke="#39765c" stroke-width="1.5"/>
<text x="706" y="729" font-size="18" font-weight="700" fill="#23513e">Independent checking</text>
<text x="706" y="777" font-size="14" fill="#4e5d72">Review adjustment and reconcile</text>
<text x="706" y="795" font-size="14" fill="#4e5d72">links</text>
<text x="662" y="153" text-anchor="middle" font-size="13" font-weight="600" fill="#46536a" stroke="#fff" stroke-width="6" paint-order="stroke">Yes</text>
<text x="500" y="253" text-anchor="middle" font-size="13" font-weight="600" fill="#46536a" stroke="#fff" stroke-width="6" paint-order="stroke">No: completed</text>
</g></svg>
