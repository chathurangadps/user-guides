<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="461" viewBox="0 0 1000 461" role="img" aria-labelledby="title desc">
<title id="title">Find no-punch days without inventing attendance</title>
<desc id="desc">Expected attendance starts from the employee population and reviewed schedule, not from whoever appears in a CSV. Generate expected attendance for a reviewed organization/date range, up to 31 days per process run. Check working days, roster rest days, holiday classifications and approved full/partial leave. Compare expected days with actual recorded punches, including employees who have none. Resolve setup and evidence issues, then process applicable recalculation and review steps.</desc>
