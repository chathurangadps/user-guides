<text x="382" y="177" font-size="14" fill="#4e5d72">Employment, roster, policy,</text>
<text x="382" y="195" font-size="14" fill="#4e5d72">calendar</text>
<rect x="688" y="100" width="272" height="126" rx="10" fill="#f5f1fa" stroke="#74539a" stroke-width="1.5"/>
<text x="706" y="129" font-size="18" font-weight="700" fill="#352347">Classify the expectation</text>
<text x="706" y="177" font-size="14" fill="#4e5d72">Workday, rest day, holiday or</text>
<text x="706" y="195" font-size="14" fill="#4e5d72">leave</text>
